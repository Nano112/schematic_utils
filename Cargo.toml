[[bin]]
name = "segment_world"
path = "examples/segment_world.rs"
required-features = ["world-segment", "store-fs"]

[dev-dependencies]
num-complex = "0.4"
base64 = "0.22"
# Golden hashes for the voxelize regression fixtures (tests/voxelize_golden.rs).
sha2 = "0.10"
ffmpeg-sidecar = "2.4"
winit = "0.30"
bincode = "1"
# Dev-only on purpose: examples that *render* mc-tick simulations. The
# production dependency direction stays one-way (mc-tick never sees nucleation).
mc-tick = { path = "crates/mc-tick" }
mc-tick-trace = { path = "crates/mc-tick-trace" }
mc-test = { path = "crates/mc-test" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
